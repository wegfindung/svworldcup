services:
  app:
    build: .
    container_name: ${APP_CONTAINER_NAME:-svworldcup-app}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-svworldcup}:${DB_PASS:-svworldcup-change-me}@db:5432/${DB_NAME:-svworldcup}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-svworldcup}
      DB_USER: ${DB_USER:-svworldcup}
      DB_PASS: ${DB_PASS:-svworldcup-change-me}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-svworldcup}.rule=Host(`${APP_HOST:-worldcup.svtool.info}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-svworldcup}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-svworldcup}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${TRAEFIK_SERVICE_NAME:-svworldcup}.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME:-svworldcup-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-svworldcup}
      POSTGRES_USER: ${DB_USER:-svworldcup}
      POSTGRES_PASSWORD: ${DB_PASS:-svworldcup-change-me}
    volumes:
      - ${DB_VOLUME_PATH:-/var/lib/svworldcup/db}:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-svworldcup} -d ${DB_NAME:-svworldcup}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
  internal:
    driver: bridge
