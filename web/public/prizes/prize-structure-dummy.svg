  <g filter="url(#softShadow)">
    <rect x="620" y="110" width="950" height="730" rx="10" fill="url(#panel)" stroke="#55d08a" stroke-width="3"/>
    <rect x="1278" y="135" width="260" height="70" rx="10" fill="#071a2a" stroke="#0cae87"/>
    <text x="1035" y="158" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="900" text-anchor="middle">THE NATIONAL LEAGUE</text>
    <text x="1035" y="195" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="900" text-anchor="middle">(COMMUNITY MILESTONE POOL)</text>
    <text x="1410" y="180" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="900" text-anchor="middle">MAX 500 SVV CAP</text>

    <text x="1038" y="255" fill="#72e2bd" font-family="Arial, sans-serif" font-size="32" font-weight="900" text-anchor="middle">GROWTH ENGINE</text>
    <line x1="750" y1="315" x2="1470" y2="315" stroke="#a5ffcc" stroke-width="12" opacity="0.35"/>
    <line x1="750" y1="315" x2="1470" y2="315" stroke="url(#track)" stroke-width="7"/>
    <text x="750" y="295" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="900">0</text>
    <text x="900" y="295" fill="#b8ffd0" font-family="Arial, sans-serif" font-size="24" font-weight="900">50 SVV</text>
    <text x="1070" y="295" fill="#b8ffd0" font-family="Arial, sans-serif" font-size="24" font-weight="900">100 SVV</text>
    <text x="1425" y="295" fill="#b8ffd0" font-family="Arial, sans-serif" font-size="24" font-weight="900">500 SVV</text>
    <text x="1458" y="320" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="900">(MAX CAP)</text>
    <text x="740" y="360" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="900">0</text>
    <text x="880" y="360" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="900">200</text>
    <text x="1045" y="360" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="900">400</text>
    <text x="1410" y="360" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="900">2000 PARTICIPANTS</text>

    <rect x="760" y="395" width="720" height="44" rx="8" fill="#051119" stroke="#4f9ec4"/>
    <text x="1120" y="424" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="900" text-anchor="middle">GUARANTEED FULL PAYOUT FLOW</text>

    <g>
      <text x="655" y="492" fill="#ffd85f" font-family="Arial, sans-serif" font-size="24" font-weight="900">WINNING NATION</text>
      <text x="655" y="520" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="800">(Highest Average Score)</text>
      <rect x="705" y="555" width="128" height="80" fill="#f7f7f7"/>
      <rect x="705" y="555" width="128" height="26" fill="#df1d2d"/>
      <rect x="705" y="609" width="128" height="26" fill="#df1d2d"/>
      <text x="870" y="590" fill="#ffffff" font-family="Arial, sans-serif" font-size="23" font-weight="900">NATION</text>
      <text x="885" y="618" fill="#ffffff" font-family="Arial, sans-serif" font-size="23" font-weight="900">SIZE?</text>
    </g>

    <g>
      <text x="990" y="492" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="900">&lt;11 MANAGERS</text>
      <text x="1005" y="520" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="800">(UNDERDOG SQUAD)</text>
      <rect x="980" y="548" width="170" height="58" fill="#ed1f2f"/>
      <rect x="980" y="548" width="170" height="29" fill="#f6c74a"/>
      <text x="1180" y="510" fill="#b8ffd0" font-family="Arial, sans-serif" font-size="18" font-weight="900">PAYOUT: 20% OF</text>
      <text x="1180" y="534" fill="#b8ffd0" font-family="Arial, sans-serif" font-size="18" font-weight="900">UNLOCKED POOL</text>
      <rect x="1320" y="495" width="190" height="78" rx="6" fill="#0c293c" stroke="#5c9dbc"/>
      <text x="1415" y="525" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">NEXT BEST</text>
      <text x="1415" y="550" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">NATION(S) UNTIL</text>
      <text x="1415" y="575" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">100% AWARDED</text>
    </g>

    <g>
      <text x="665" y="704" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="900">Path 2: 11+ MANAGERS</text>
      <text x="680" y="732" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="800">(FULL SQUAD)</text>
      <rect x="980" y="650" width="170" height="58" fill="#ed1f2f"/>
      <rect x="980" y="650" width="170" height="29" fill="#f6c74a"/>
      <text x="1180" y="660" fill="#b8ffd0" font-family="Arial, sans-serif" font-size="19" font-weight="900">PAYOUT: 100% OF</text>
      <text x="1180" y="686" fill="#b8ffd0" font-family="Arial, sans-serif" font-size="19" font-weight="900">UNLOCKED POOL</text>
      <rect x="1330" y="642" width="185" height="88" rx="6" fill="#0c293c" stroke="#5c9dbc"/>
      <text x="1422" y="674" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">DISTRIBUTE</text>
      <text x="1422" y="699" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">FULL AMOUNT</text>
      <text x="1422" y="724" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">AMONG ALL MEMBERS</text>
    </g>

    <rect x="640" y="770" width="900" height="52" rx="8" fill="#0a3540" stroke="#59c996"/>
    <text x="1090" y="802" fill="#d7ffe6" font-family="Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle">
      FULL UNLOCKED POOL FROM THE ACHIEVED MILESTONE IS ALWAYS DISTRIBUTED
    </text>
  </g>

  <g opacity="0.92">
    <circle cx="688" cy="218" r="20" fill="#22bd93"/>
    <text x="688" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle">SVV</text>
    <circle cx="1508" cy="118" r="25" fill="#22bd93"/>
    <text x="1508" y="126" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="900" text-anchor="middle">SVV</text>
  </g>
</svg>
