<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Grand Tournament prize structure dummy</title>
  <desc id="desc">Draft visualization of individual prizes and the national league milestone pool.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071425"/>
      <stop offset="0.48" stop-color="#082a34"/>
      <stop offset="1" stop-color="#0c472f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#0b2133"/>
      <stop offset="1" stop-color="#0c4d3a"/>
    </linearGradient>
    <linearGradient id="track" x1="0" x2="1">
      <stop offset="0" stop-color="#1fbf91"/>
      <stop offset="1" stop-color="#8ff4b8"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020808" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.16">
    <path d="M0 110H1600M0 230H1600M0 350H1600M0 470H1600M0 590H1600M0 710H1600M0 830H1600" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V900M260 0V900M420 0V900M580 0V900M740 0V900M900 0V900M1060 0V900M1220 0V900M1380 0V900M1540 0V900" stroke="#ffffff" stroke-width="1"/>
  </g>

  <text x="58" y="70" fill="#f2efe7" font-family="Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="1">
    SOCCERVERSE WORLD CUP EVENT: PRIZE STRUCTURE &amp; GROWTH ENGINE
  </text>

  <g filter="url(#softShadow)">
    <rect x="30" y="110" width="560" height="730" rx="10" fill="#071a2a" stroke="#58b9da" stroke-width="3"/>
    <rect x="50" y="205" width="520" height="58" fill="#03080d"/>
    <text x="310" y="160" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle">
      INDIVIDUAL LEAGUES
    </text>
    <text x="310" y="194" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">
      (ROOKIE &amp; VETERAN)
    </text>
    <text x="310" y="243" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle">
      SAME PRIZES FOR BOTH LEAGUES
    </text>
    <text x="58" y="293" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="800">RANK 1-10</text>

    <g>
      <rect x="55" y="310" width="120" height="96" rx="10" fill="#0a6270" stroke="#2bbd9a"/>
      <text x="85" y="371" fill="#ffd85f" font-family="Arial, sans-serif" font-size="38" font-weight="900">1</text>
      <circle cx="135" cy="360" r="24" fill="#e6c171" stroke="#0f3e45" stroke-width="7"/>
      <rect x="205" y="305" width="350" height="105" rx="10" fill="#0d4b52"/>
      <text x="305" y="350" fill="#ffd85f" font-family="Arial, sans-serif" font-size="30" font-weight="900">1st Place</text>
      <circle cx="325" cy="385" r="16" fill="#22bd93"/>
      <text x="350" y="394" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="900">200 SVV</text>
      <text x="305" y="424" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="800">+ Exclusive Winner Shirt</text>
    </g>

    <g>
      <rect x="55" y="430" width="120" height="96" rx="10" fill="#11395a" stroke="#58b9da"/>
      <text x="82" y="492" fill="#d7e1e4" font-family="Arial, sans-serif" font-size="36" font-weight="900">2</text>
      <circle cx="135" cy="480" r="24" fill="#6ea6af" stroke="#0b2230" stroke-width="7"/>
      <rect x="205" y="425" width="350" height="105" rx="10" fill="#103f58"/>
      <text x="305" y="468" fill="#f1eee7" font-family="Arial, sans-serif" font-size="30" font-weight="900">2nd Place</text>
      <circle cx="325" cy="503" r="16" fill="#22bd93"/>
      <text x="350" y="512" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="900">100 SVV</text>
      <text x="305" y="542" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="800">+ Exclusive Cap</text>
    </g>

    <g>
      <rect x="55" y="550" width="120" height="96" rx="10" fill="#11444e" stroke="#9b6e48"/>
      <text x="82" y="612" fill="#d9ad5d" font-family="Arial, sans-serif" font-size="36" font-weight="900">3</text>
      <circle cx="135" cy="600" r="24" fill="#f0b16b" stroke="#0b3232" stroke-width="7"/>
      <rect x="205" y="545" width="350" height="105" rx="10" fill="#0f3d54"/>
      <text x="305" y="588" fill="#d9ad5d" font-family="Arial, sans-serif" font-size="30" font-weight="900">3rd Place</text>
      <circle cx="325" cy="623" r="16" fill="#22bd93"/>
      <text x="350" y="632" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="900">75 SVV</text>
    </g>

    <g>
      <rect x="55" y="670" width="120" height="96" rx="10" fill="#112f42" stroke="#20495d"/>
      <text x="82" y="732" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="900">4</text>
      <circle cx="135" cy="720" r="24" fill="#d9ad5d" stroke="#0b3232" stroke-width="7"/>
      <rect x="205" y="665" width="350" height="105" rx="10" fill="#103545"/>
      <text x="250" y="708" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="900">4th to 10th Place</text>
      <circle cx="325" cy="743" r="16" fill="#22bd93"/>
      <text x="350" y="752" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="900">20 SVV Each</text>
    </g>
